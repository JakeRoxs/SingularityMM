name: Scan for new NMS mods

on:
  schedule:
    # Every Monday at 09:00 UTC.
    - cron: '0 9 * * 1'
  workflow_dispatch:
    inputs:
      period:
        description: 'Lookback window'
        required: false
        default: '1m'
        type: choice
        options:
          - 1d
          - 1w
          - 1m

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data branch
        uses: actions/checkout@v6
        with:
          ref: data

      - name: Checkout main branch for script
        uses: actions/checkout@v6
        with:
          ref: main
          path: ./.github/main-branch-checkout
          sparse-checkout: |
            .github/scripts

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Scan Nexus for new mods
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          PERIOD: ${{ inputs.period || '1m' }}
          MOD_WARNINGS_PATH: mod_warnings.json
          BLACKLIST_PATH: mod_blacklist.json
        run: node ./.github/main-branch-checkout/.github/scripts/scan-new-mods.cjs

      - name: Commit and push changes to the data branch
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "chore: add newly discovered NMS mods"
          file_pattern: mod_warnings.json
